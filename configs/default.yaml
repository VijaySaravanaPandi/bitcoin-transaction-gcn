# =============================================================================
# Vanilla GCN — Default Configuration (Elliptic++ Transactions Dataset)
# =============================================================================
# Dataset: Elliptic++ Transactions
#   Nodes (transactions) : 203,769
#   Edges (money flow)   : 234,355
#   Features per node    : 183  (txs_features.csv cols 1-183; col 0 = txId)
#   Classes              : 2  (0 = illicit, 1 = licit)
#   Labelled nodes       : 46,564  (4,545 illicit + 42,019 licit)
#   Unknown nodes        : 157,205  (included in graph but not in masks)
# =============================================================================

seed: 42

model:
  # Dimensionality of hidden GCN layers
  # Larger than synthetic baseline to capture 183-feature input space
  hidden_dim: 64
  # Number of GCN layers (depth)
  num_layers: 2
  # Dropout probability — helps regularise on the large graph
  dropout: 0.5

training:
  # Adam learning rate
  learning_rate: 0.001
  # L2 regularization (weight decay)
  weight_decay: 0.0005
  # Total training epochs — more iterations for a larger graph
  epochs: 200

data:
  # Fraction of *labelled* nodes used for training
  train_ratio: 0.6
  # Fraction of *labelled* nodes used for validation
  validation_ratio: 0.2
  # Fraction of *labelled* nodes used for testing
  test_ratio: 0.2
  # Dataset to load: "elliptic" | "synthetic"
  dataset: "elliptic"
  # Directory containing txs_features.csv, txs_classes.csv, txs_edgelist.csv
  raw_dir: "data/raw"

debug:
  # When true, GCNLayer prints shape/stats at every forward pass
  enabled: false

paths:
  # All paths are relative to the project root
  data_raw: "data/raw"
  data_processed: "data/processed"
  outputs: "outputs"
  checkpoints: "outputs/checkpoints"
  figures: "outputs/figures"
  embeddings: "outputs/embeddings"
  logs: "outputs/logs"
