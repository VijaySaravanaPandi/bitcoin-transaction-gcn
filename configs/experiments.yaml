# =============================================================================
# Vanilla GCN — Experiments Configuration (Elliptic++ Transactions Dataset)
# =============================================================================
# Each entry overrides values from default.yaml.
# Dataset stats:  N=203,769  F=183  C=2  labelled=46,564
# =============================================================================

experiments:
  elliptic_baseline:
    description: "Elliptic++ baseline — 2-layer GCN, hidden=64, dropout=0.5"
    seed: 42
    data:
      dataset: "elliptic"
      raw_dir: "data/raw"
    model:
      hidden_dim: 64
      num_layers: 2
      dropout: 0.5
    training:
      learning_rate: 0.001
      weight_decay: 0.0005
      epochs: 200

  elliptic_wider:
    description: "Elliptic++ wider hidden layer — hidden=128"
    seed: 42
    data:
      dataset: "elliptic"
      raw_dir: "data/raw"
    model:
      hidden_dim: 128
      num_layers: 2
      dropout: 0.5
    training:
      learning_rate: 0.001
      weight_decay: 0.0005
      epochs: 200

  elliptic_deep:
    description: "Elliptic++ deeper GCN — 3 layers (risk of over-smoothing)"
    seed: 42
    data:
      dataset: "elliptic"
      raw_dir: "data/raw"
    model:
      hidden_dim: 64
      num_layers: 3
      dropout: 0.5
    training:
      learning_rate: 0.001
      weight_decay: 0.0005
      epochs: 200

  oversmoothing_sweep:
    description: "Sweep over depths to visualise over-smoothing on Elliptic++"
    seed: 42
    layers_to_test: [1, 2, 3, 5, 8, 10]
    data:
      dataset: "elliptic"
      raw_dir: "data/raw"
    model:
      hidden_dim: 64
      dropout: 0.5
    training:
      learning_rate: 0.001
      weight_decay: 0.0005
      epochs: 200
